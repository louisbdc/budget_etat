[project]
name = "budget-etat"
version = "0.1.0"
description = "Outil perso d'exploration et de simulation du budget de l'État français"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",  # pièces jointes .xlsx
    "xlrd>=2.0",  # pièces jointes .xls (format BIFF)
    "pypdf>=4",  # notes de bas de tableau dans les PDF (inspection seulement)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
budget = "budget_etat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
